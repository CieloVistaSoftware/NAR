<div class="page__hero">
  <h1>🐛 Issues</h1>
  <p>Open issues from <a href="https://github.com/CieloVistaSoftware/test/issues" target="_blank" rel="noopener">GitHub</a>.</p>
</div>

<div class="issues-toolbar">
  <input type="search" id="issues-search" class="issues-search" placeholder="Filter by title or number…">
  <span id="issues-summary" class="issues-summary"></span>
  <button type="button" id="new-issue-btn" class="new-issue-btn" x-ripple>+ New Issue</button>
</div>

<div id="new-issue-form" class="new-issue-form" hidden>
  <label class="new-issue-field">
    <span>Title</span>
    <input type="text" id="new-issue-title" placeholder="Short summary of the issue">
  </label>
  <label class="new-issue-field">
    <span>Description</span>
    <textarea id="new-issue-body" rows="5" placeholder="What's wrong, and what did you expect instead?"></textarea>
  </label>
  <div class="new-issue-actions">
    <button type="button" id="new-issue-cancel" class="new-issue-btn new-issue-btn--secondary">Cancel</button>
    <button type="button" id="new-issue-submit" class="new-issue-btn">Continue on GitHub →</button>
  </div>
  <p class="new-issue-note">
    Opens a pre-filled issue on GitHub to submit — this site never holds a GitHub token, so
    creating an issue always happens under your own GitHub account, not this site's.
  </p>
</div>

<p id="issues-status" class="issues-status">Loading issues…</p>
<div id="issues-grid" class="issues-grid"></div>

<style>
  .issues-toolbar { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0 1rem; flex-wrap: wrap; }
  .issues-search { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.4rem 0.75rem; min-width: 240px; flex: 1; }
  .issues-summary { color: var(--text-secondary); font-size: 0.85rem; white-space: nowrap; }
  .issues-status { color: var(--text-secondary); }
  .new-issue-btn { background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .new-issue-btn--secondary { background: var(--bg-tertiary); color: var(--text-primary); }
  .new-issue-form { border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); padding: 1.25rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .new-issue-field { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; color: var(--text-secondary); }
  .new-issue-field input, .new-issue-field textarea { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.5rem 0.75rem; font-family: inherit; font-size: 0.95rem; resize: vertical; }
  .new-issue-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
  .new-issue-note { margin: 0; font-size: 0.75rem; color: var(--text-secondary); }

  .issues-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
  .issue-card { border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); padding: 1.1rem 1.25rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .issue-card__header { display: flex; align-items: baseline; gap: 0.5rem; }
  .issue-card__number { color: var(--text-secondary); font-family: monospace; font-size: 0.8rem; }
  .issue-card__title { margin: 0; font-size: 1rem; }
  .issue-card__title a { color: var(--text-primary); text-decoration: none; }
  .issue-card__title a:hover { color: var(--primary); text-decoration: underline; }
  .issue-card__desc { margin: 0; color: var(--text-secondary); font-size: 0.85rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .issue-card__labels { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .issue-card__label { font-size: 0.7rem; padding: 0.1em 0.5em; border-radius: 999px; background: var(--bg-tertiary); color: var(--text-secondary); }
  .issue-card__meta { display: flex; align-items: center; gap: 0.5rem; margin-top: auto; padding-top: 0.6rem; border-top: 1px solid var(--border-color); font-size: 0.75rem; color: var(--text-secondary); }
  .issue-card__avatar { width: 20px; height: 20px; border-radius: 50%; }
  .issue-card__dates { display: flex; flex-direction: column; gap: 0.1rem; margin-left: auto; text-align: right; }
</style>

<script>
(function () {
  const REPO = 'CieloVistaSoftware/test';
  const gridEl = document.getElementById('issues-grid');
  const statusEl = document.getElementById('issues-status');
  const summaryEl = document.getElementById('issues-summary');
  const searchEl = document.getElementById('issues-search');
  const newIssueBtn = document.getElementById('new-issue-btn');
  const newIssueForm = document.getElementById('new-issue-form');
  const newIssueTitle = document.getElementById('new-issue-title');
  const newIssueBody = document.getElementById('new-issue-body');
  let allIssues = [];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = !q
      ? allIssues
      : allIssues.filter((i) => i.title.toLowerCase().includes(q) || String(i.number).includes(q));

    summaryEl.textContent = `${filtered.length} open ${filtered.length === 1 ? 'issue' : 'issues'}`;

    if (!filtered.length) {
      gridEl.innerHTML = '';
      statusEl.textContent = allIssues.length ? 'No issues match this filter.' : 'No open issues.';
      statusEl.style.display = '';
      return;
    }
    statusEl.style.display = 'none';

    gridEl.innerHTML = filtered.map((issue) => {
      const labels = (issue.labels || []).map((l) =>
        `<span class="issue-card__label" style="background:#${l.color || '333'}22;color:#${l.color || '999'}">${escapeHtml(l.name)}</span>`
      ).join('');
      const author = issue.user || {};
      return `
        <article class="issue-card">
          <div class="issue-card__header">
            <span class="issue-card__number">#${issue.number}</span>
            <h3 class="issue-card__title"><a href="${issue.html_url}" target="_blank" rel="noopener">${escapeHtml(issue.title)}</a></h3>
          </div>
          <p class="issue-card__desc">${escapeHtml(issue.body || 'No description provided.')}</p>
          ${labels ? `<div class="issue-card__labels">${labels}</div>` : ''}
          <div class="issue-card__meta">
            ${author.avatar_url ? `<img class="issue-card__avatar" src="${author.avatar_url}" alt="">` : ''}
            <span>${escapeHtml(author.login || 'unknown')}</span>
            <div class="issue-card__dates">
              <span>Created ${fmtDate(issue.created_at)}</span>
              <span>Updated ${fmtDate(issue.updated_at)}</span>
            </div>
          </div>
        </article>`;
    }).join('');
  }

  searchEl.addEventListener('input', render);

  newIssueBtn.addEventListener('click', () => {
    newIssueForm.hidden = !newIssueForm.hidden;
    if (!newIssueForm.hidden) newIssueTitle.focus();
  });
  document.getElementById('new-issue-cancel').addEventListener('click', () => {
    newIssueForm.hidden = true;
    newIssueTitle.value = '';
    newIssueBody.value = '';
  });
  document.getElementById('new-issue-submit').addEventListener('click', () => {
    const title = newIssueTitle.value.trim();
    const body = newIssueBody.value.trim();
    if (!title) { newIssueTitle.focus(); return; }
    const url = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
    window.open(url, '_blank', 'noopener');
  });

  async function load() {
    try {
      const perPage = 100;
      let page = 1;
      let all = [];
      while (page <= 10) {
        statusEl.textContent = `Loading issues… (${all.length} so far)`;
        statusEl.style.display = '';
        const res = await fetch(`https://api.github.com/repos/${REPO}/issues?state=open&per_page=${perPage}&page=${page}&sort=created&direction=desc`);
        if (!res.ok) throw new Error(`GitHub API responded ${res.status}`);
        const batch = await res.json();
        all = all.concat(batch);
        if (batch.length < perPage) break;
        page++;
      }
      // The /issues endpoint also returns pull requests -- exclude them.
      allIssues = all.filter((i) => !i.pull_request);
      render();
    } catch (err) {
      statusEl.textContent = 'Could not load issues: ' + err.message + ' (GitHub API rate limits unauthenticated requests to 60/hour per IP).';
      statusEl.style.display = '';
    }
  }

  load();
})();
</script>
